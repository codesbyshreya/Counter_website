<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="nav">
            <div id="heading">
                <p>Mantra Japa Tracker</p>
            </div>
            <button id="toggle">Light Mode</button>
        </div>
    </header>
    <main class="main">
        <div class="counter-card">
            <div id="counter-display">
                <div id="user-count">0</div>
                <div id="target-count">Target: 108</div>
                <div id="message">Message</div>
            </div>
            <div class="container">
                <div id="buttonadd">•</div>
                <button id="reset">Reset</button>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer">
            <p>Made with &hearts; by codebyshreya</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
